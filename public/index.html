<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Hemp History | 世界の麻の歴史と今</title>
<meta name="description" content="世界の麻(ヘンプ)にまつわる最新ニュース、1600年代から現代までの歴史タイムライン、世界中の企業・プロダクトを紹介するPi Networkアプリ" />
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#efe8d3; --surface:#fffdf6; --surface-2:#f7f1de;
    --ink:#241f15; --ink-muted:#6b5f47; --border:#d6cba8;
    --primary:#2f5233; --primary-dark:#1c3620; --primary-soft:#dde6d6;
    --accent:#c9962b; --accent-soft:#f3e4bf;
    --shadow:0 6px 20px rgba(28,54,32,0.12);
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--ink);font-family:'Work Sans',system-ui,-apple-system,sans-serif;margin:0;line-height:1.65;}
  h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0;}
  a{color:var(--primary-dark);}
  img{max-width:100%;}
  select{font-family:inherit;}
  .wrap{max-width:1080px;margin:0 auto;padding-inline:20px;}

  .leaf-icon-sm{width:14px;height:14px;fill:currentColor;flex:none;}
  .tag-leaf{width:10px;height:10px;fill:currentColor;vertical-align:-1px;margin-right:3px;flex:none;}

  .notice{background:var(--accent-soft);color:var(--ink);font-size:0.82rem;text-align:center;padding:8px 16px;border-bottom:1px solid var(--border);}

  header.site-header{position:sticky;top:0;z-index:50;background:rgba(246,243,234,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
  .nav-inner{max-width:1080px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:9px;font-family:'Fraunces',serif;font-weight:600;font-size:1.1rem;color:var(--primary-dark);}
  .brand svg{width:22px;height:22px;flex:none;fill:var(--primary);}
  nav.main-nav{display:flex;gap:22px;flex-wrap:wrap;}
  nav.main-nav a{color:var(--ink);text-decoration:none;font-size:0.92rem;border-bottom:2px solid transparent;padding-bottom:2px;}
  nav.main-nav a:hover{border-color:var(--accent);}
  .nav-right{display:flex;align-items:center;gap:12px;}
  .pi-status{font-size:0.78rem;color:var(--ink-muted);white-space:nowrap;}
  .pi-signin-btn{border:1px solid var(--border);background:var(--primary-dark);color:#fff;padding:5px 12px;border-radius:999px;font-size:0.78rem;font-weight:600;cursor:pointer;white-space:nowrap;}
  .pi-signin-btn[hidden]{display:none;}
  .pi-diag{font-size:0.75rem;color:crimson;padding:0 20px;word-break:break-word;}
  .pi-diag:not(:empty){padding:8px 20px;background:#fff3f3;border-bottom:1px solid #f3c9c9;}
  .lang-switch{display:flex;align-items:center;gap:5px;}
  .lang-switch svg{width:14px;height:14px;fill:var(--ink-muted);}
  #langSelect{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:5px 8px;border-radius:8px;font-size:0.8rem;cursor:pointer;}

  .hero{padding:56px 20px 0;overflow:hidden;}
  .hero-inner{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:center;}
  .hero h1{font-size:clamp(2rem,4vw,2.7rem);color:var(--primary-dark);letter-spacing:-0.01em;}
  .hero .kicker{display:flex;align-items:center;gap:7px;font-size:0.78rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:10px;}
  .hero p{color:var(--ink-muted);font-size:1.02rem;max-width:46ch;margin-top:14px;}
  .hero .domain{display:inline-flex;align-items:center;gap:7px;margin-top:22px;padding:7px 14px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dark);font-size:0.82rem;font-weight:600;}
  .hero-art{width:100%;height:auto;max-width:300px;justify-self:center;}
  .leaf-a{fill:var(--primary);opacity:0.96;}
  .leaf-b{fill:var(--primary-dark);opacity:0.85;}
  .leaf-c{fill:var(--accent);opacity:0.9;}
  @media (max-width:720px){ .hero-inner{grid-template-columns:1fr;} .hero-art{max-width:220px;order:-1;} }

  .garland{display:flex;justify-content:center;gap:6px;padding:34px 0 0;opacity:0.55;}
  .garland svg{width:20px;height:20px;fill:var(--primary);}
  .garland svg:nth-child(odd){transform:rotate(-14deg) translateY(3px);}
  .garland svg:nth-child(even){transform:rotate(14deg) translateY(-2px);}

  section{padding:52px 0;border-top:1px solid var(--border);}
  .section-head{margin-bottom:26px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;}
  .section-head .eyebrow{display:flex;align-items:center;gap:6px;font-size:0.76rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);font-weight:700;}
  .section-head h2{font-size:1.5rem;color:var(--primary-dark);margin-top:6px;}
  .section-head p{color:var(--ink-muted);margin:6px 0 0;max-width:56ch;font-size:0.95rem;}

  .news-meta{font-size:0.82rem;color:var(--ink-muted);margin-bottom:16px;}
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
  .news-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;position:relative;}
  .news-card .leaf-watermark{position:absolute;right:-14px;top:-14px;width:76px;height:76px;fill:var(--primary);opacity:0.07;pointer-events:none;}
  .news-card .body{position:relative;padding:17px 16px;display:flex;flex-direction:column;gap:8px;}
  .news-card h3{font-size:1rem;font-family:'Work Sans',sans-serif;font-weight:600;line-height:1.4;}
  .news-card p{font-size:0.86rem;color:var(--ink-muted);margin:0;}
  .news-card .mt-badge{align-self:flex-start;font-size:0.68rem;color:var(--primary-dark);background:var(--primary-soft);padding:2px 7px;border-radius:999px;}
  .news-card .src{font-size:0.76rem;color:var(--ink-muted);display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border);padding-top:8px;}
  .news-card .src a{color:var(--primary-dark);font-weight:600;text-decoration:none;}
  .news-empty{color:var(--ink-muted);font-size:0.9rem;padding:24px;background:var(--surface-2);border-radius:10px;}

  .timeline{position:relative;margin-left:6px;padding-left:26px;border-left:2px solid var(--primary-soft);}
  .tl-item{position:relative;padding-bottom:28px;}
  .tl-item:last-child{padding-bottom:0;}
  .tl-leaf{position:absolute;left:-33px;top:2px;width:16px;height:16px;fill:var(--primary);}
  .tl-year{font-weight:700;color:var(--accent);font-size:0.88rem;letter-spacing:0.02em;}
  .tl-item h3{font-size:1.04rem;color:var(--primary-dark);margin:3px 0 6px;}
  .tl-item p{margin:0;font-size:0.92rem;color:var(--ink);}

  .cat-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
  .cat-filters button{border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:999px;font-size:0.83rem;cursor:pointer;font-family:inherit;}
  .cat-filters button.active{background:var(--primary);border-color:var(--primary);color:#fff;}
  .company-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:26px;}
  .company-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:17px;}
  .company-card .company-logo{width:40px;height:40px;object-fit:contain;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);margin-bottom:8px;display:block;}
  .company-card .cat-tag{display:inline-flex;align-items:center;font-size:0.7rem;background:var(--primary-soft);color:var(--primary-dark);padding:3px 9px 3px 8px;border-radius:999px;margin-bottom:8px;font-weight:600;}
  .company-card h3{font-family:'Work Sans',sans-serif;font-weight:600;font-size:1.02rem;margin-bottom:5px;}
  .company-card .country{font-size:0.76rem;color:var(--ink-muted);margin-bottom:6px;}
  .company-card p{font-size:0.87rem;margin:0 0 10px;}
  .company-card a.site-link{font-size:0.82rem;font-weight:600;text-decoration:none;}
  .company-empty{color:var(--ink-muted);font-size:0.9rem;padding:24px;background:var(--surface-2);border-radius:10px;margin-bottom:20px;}

  .cta-box{background:var(--primary-soft);border-radius:10px;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
  .cta-box .price{font-weight:700;color:var(--primary-dark);font-family:'Fraunces',serif;font-size:1.05rem;}
  button.primary-btn{background:var(--primary);color:#fff;border:none;padding:11px 22px;border-radius:999px;font-size:0.92rem;font-weight:600;cursor:pointer;font-family:inherit;}
  button.primary-btn:hover{background:var(--primary-dark);}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,22,14,0.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:100;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border-radius:12px;max-width:440px;width:100%;padding:24px;max-height:90vh;overflow-y:auto;}
  .modal h3{font-size:1.15rem;color:var(--primary-dark);margin-bottom:4px;}
  .modal label{display:block;font-size:0.82rem;margin:12px 0 4px;color:var(--ink-muted);}
  .modal input,.modal select,.modal textarea{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:7px;font-size:0.9rem;font-family:inherit;background:var(--surface);color:var(--ink);}
  .modal textarea{min-height:76px;resize:vertical;}
  .modal .modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}
  .modal .modal-actions button.link-btn{background:none;border:none;color:var(--ink-muted);cursor:pointer;font-family:inherit;font-size:0.88rem;}
  #formMsg{font-size:0.84rem;margin-top:10px;min-height:1.2em;}

  footer{padding:30px 20px;text-align:center;color:var(--ink-muted);font-size:0.8rem;border-top:1px solid var(--border);}
  footer .foot-brand{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:4px;color:var(--primary-dark);font-weight:600;}
  footer .foot-brand svg{width:14px;height:14px;fill:var(--primary);}
  footer .foot-links{display:flex;justify-content:center;gap:16px;margin-top:12px;flex-wrap:wrap;}
  footer .foot-links button{background:none;border:none;color:var(--ink-muted);text-decoration:underline;cursor:pointer;font-size:0.78rem;font-family:inherit;padding:2px;}
  footer .foot-links button:hover{color:var(--primary-dark);}

  .stats-band{background:var(--primary-dark);color:#f3f1e6;}
  .stats-inner{padding:44px 20px;}
  .stats-head .eyebrow{color:var(--accent);}
  .stats-head h2{color:#f3f1e6;margin-top:6px;font-size:1.35rem;}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-top:22px;}
  .stat-tile{background:rgba(255,255,255,0.09);border-radius:12px;padding:18px;}
  .stat-tile .value{font-family:'Fraunces',serif;font-size:1.7rem;font-weight:700;line-height:1.2;}
  .stat-tile .label{font-size:0.84rem;margin-top:6px;opacity:0.92;}
  .stat-tile .caption{font-size:0.74rem;opacity:0.68;margin-top:5px;}
  .stats-source{font-size:0.7rem;opacity:0.55;margin-top:20px;}

  .cta-headline{font-family:'Fraunces',serif;font-weight:600;font-size:1.15rem;color:var(--primary-dark);margin-bottom:10px;}
  .cta-benefits{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:6px;}
  .cta-benefits li{display:flex;align-items:flex-start;gap:8px;font-size:0.88rem;color:var(--ink);}
  .cta-benefits svg{width:14px;height:14px;fill:var(--primary);flex:none;margin-top:3px;}
  .cta-price-row{font-size:0.85rem;color:var(--ink-muted);}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <path id="leaflet" d="M0,0 L1,-2 L5,-8 L3,-14 L7,-20 L4,-27 L8,-34 L5,-41 L8.5,-48 L5,-55 L7,-62 L4,-68 L5.5,-74 L2.5,-80 L0,-88 L-2.5,-80 L-5.5,-74 L-4,-68 L-7,-62 L-5,-55 L-8.5,-48 L-5,-41 L-8,-34 L-4,-27 L-7,-20 L-3,-14 L-5,-8 L-1,-2 Z"/>
    <g id="hemp-leaf-shape">
      <use href="#leaflet" transform="rotate(-62) scale(0.52)"/>
      <use href="#leaflet" transform="rotate(-38) scale(0.74)"/>
      <use href="#leaflet" transform="rotate(-18) scale(0.92)"/>
      <use href="#leaflet" transform="rotate(0) scale(1)"/>
      <use href="#leaflet" transform="rotate(18) scale(0.92)"/>
      <use href="#leaflet" transform="rotate(38) scale(0.74)"/>
      <use href="#leaflet" transform="rotate(62) scale(0.52)"/>
    </g>
  </defs>
</svg>

<div class="notice" data-i18n="noticeBanner"></div>

<header class="site-header">
  <div class="nav-inner">
    <div class="brand"><svg viewBox="-85 -95 170 100"><use href="#hemp-leaf-shape"/></svg>World Hemp History</div>
    <nav class="main-nav">
      <a href="#news" data-i18n="navNews"></a>
      <a href="#timeline" data-i18n="navTimeline"></a>
      <a href="#companies" data-i18n="navCompanies"></a>
    </nav>
    <div class="nav-right">
      <div class="lang-switch">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 4 6 4 9s-1.5 6.5-4 9c-2.5-2.5-4-6-4-9s1.5-6.5 4-9Z"/></svg>
        <select id="langSelect" aria-label="Language">
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="zh">中文</option>
          <option value="ko">한국어</option>
          <option value="es">Español</option>
        </select>
      </div>
      <button type="button" class="pi-signin-btn" id="piSignIn">Pi Sign-in</button>
      <span class="pi-status" id="piStatus">Pi未接続</span>
    </div>
  </div>
</header>
<div class="pi-diag" id="piDiag"></div>

<section class="hero">
  <div class="hero-inner">
    <div>
      <div class="kicker"><svg class="leaf-icon-sm" viewBox="-85 -95 170 100"><use href="#hemp-leaf-shape"/></svg>Global hemp, from root to record</div>
      <h1>World Hemp History</h1>
      <p data-i18n="heroDesc"></p>
      <span class="domain"><svg class="leaf-icon-sm" viewBox="-85 -95 170 100" style="fill:var(--primary-dark)"><use href="#hemp-leaf-shape"/></svg><span data-i18n="domainBadge"></span></span>
    </div>
    <svg class="hero-art" viewBox="0 0 320 280" aria-hidden="true">
      <use href="#hemp-leaf-shape" class="leaf-c" transform="translate(232,196) rotate(24) scale(1.05)"/>
      <use href="#hemp-leaf-shape" class="leaf-b" transform="translate(108,200) rotate(-16) scale(0.85)"/>
      <use href="#hemp-leaf-shape" class="leaf-a" transform="translate(172,95) rotate(3) scale(1.4)"/>
    </svg>
  </div>
  <div class="garland">
    <svg viewBox="-85 -95 170 100"><use href="#hemp-leaf-shape"/></svg>
    <svg viewBox="-85 -95 170 100"><use href="#hemp-leaf-shape"/></svg>
    <svg viewBox="-85 -95 170 100"><use href="#hemp-leaf-shape"/></svg>
    <svg viewBox="-85 -95 170 100"><use href="#hemp-leaf-shape"/></svg>
    <svg viewBox="-85 -95 170 100"><use href="#hemp-leaf-shape"/></svg>
  </div>
</section>

<section class="stats-band">
  <div class="wrap stats-inner">
    <div class="stats-head">
      <div class="eyebrow"><svg class="leaf-icon-sm" viewBox="-85 -95 170 100"><use href="#hemp-leaf-shape"/></svg>Numbers</div>
      <h2 data-i18n="statsTitle"></h2>
      <p style="color:#f3f1e6;opacity:0.8;margin-top:6px;font-size:0.92rem;" data-i18n="statsDesc"></p>
    </div>
    <div class="stats-grid" id="statsGrid"></div>
    <p class="stats-source">Sources: Grand View Research, Industrial Hemp Market (2025) · Darshil Shah / Cambridge Centre for Natural Material Innovation, via Dezeen (2021)</p>
  </div>
</section>

<main class="wrap">

  <section id="news">
    <div class="section-head">
      <div>
        <div class="eyebrow"><svg class="leaf-icon-sm" viewBox="-85 -95 170 100"><use href="#hemp-leaf-shape"/></svg><span data-i18n="eyebrowLatest"></span></div>
        <h2 data-i18n="sectionNewsTitle"></h2>
        <p data-i18n="sectionNewsDesc"></p>
      </div>
    </div>
    <div class="news-meta" id="newsMeta"></div>
    <div class="news-grid" id="newsGrid"></div>
  </section>

  <section id="timeline">
    <div class="section-head">
      <div>
        <div class="eyebrow"><svg class="leaf-icon-sm" viewBox="-85 -95 170 100"><use href="#hemp-leaf-shape"/></svg><span data-i18n="eyebrowHistory"></span></div>
        <h2 data-i18n="sectionTimelineTitle"></h2>
        <p data-i18n="sectionTimelineDesc"></p>
      </div>
    </div>
    <div class="timeline" id="timelineList"></div>
  </section>

  <section id="companies">
    <div class="section-head">
      <div>
        <div class="eyebrow"><svg class="leaf-icon-sm" viewBox="-85 -95 170 100"><use href="#hemp-leaf-shape"/></svg><span data-i18n="eyebrowDirectory"></span></div>
        <h2 data-i18n="sectionCompaniesTitle"></h2>
        <p data-i18n="sectionCompaniesDesc"></p>
      </div>
    </div>

    <div class="cat-filters" id="catFilters"></div>
    <div id="companyGrid" class="company-grid"></div>
    <div class="company-empty" id="companyEmpty" style="display:none;"></div>

    <div class="cta-box">
      <div>
        <div class="cta-headline" data-i18n="ctaHeadline"></div>
        <ul class="cta-benefits" id="ctaBenefits"></ul>
        <div class="cta-price-row"><span class="price" data-i18n="ctaPrice"></span> <span data-i18n="ctaDesc"></span></div>

</main>

<footer>
  <div class="foot-brand"><svg viewBox="-85 -95 170 100"><use href="#hemp-leaf-shape"/></svg>World Hemp History</div>
  <span data-i18n="footerTagline"></span><br/>
  <span data-i18n="footerNote"></span>
  <div class="foot-links">
    <button type="button" data-topic="about" class="info-link"></button>
    <button type="button" data-topic="contact" class="info-link"></button>
    <button type="button" data-topic="privacy" class="info-link"></button>

<script>

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
// href/src に埋め込む前に、http(s)以外のスキーム(javascript: 等)を弾く。
// サーバー側でも同様のバリデーションを行っているが、念のためフロント側でも防御する。
function isSafeHttpUrl(url){
  if(!url) return false;
  try{
    const u = new URL(url, window.location.href);
    return u.protocol === 'http:' || u.protocol === 'https:';
  }catch(e){ return false; }
}

/* ---------------- Pi SDK ---------------- */
let piUser = null;
let piAccessToken = null; // サーバー側で /v2/me により検証するためのアクセストークン(申込者の本人確認用)
const SIGNIN_LABELS = {ja:'Piでサインイン',en:'Sign in with Pi',zh:'使用Pi登录',ko:'Pi로 로그인',es:'Iniciar sesión con Pi'};
function updateSignInButton(){
  const btn = document.getElementById('piSignIn');
  if(!btn) return;
  btn.textContent = SIGNIN_LABELS[currentLang] || SIGNIN_LABELS.en;
  btn.hidden = !!piUser; // サインイン済みなら非表示
}
function showPiDiag(msg){
  const el = document.getElementById('piDiag');
  if(el) el.textContent = msg || '';
}
let piReady = false;
async function initPi(){
  try{
    if(typeof Pi === 'undefined'){ showPiDiag('Pi SDK not loaded (open in Pi Browser)'); return; }
    // sandboxフラグはサーバーの /api/config から取得する(.envのPI_SANDBOXを変更する
    // だけで本番切替できるようにするため、ここではハードコードしない)。
    // 万一/api/configが取得できない場合は、安全側としてsandbox: trueで初期化する。
    let sandbox = true;
    try{
      const cfg = await fetch('/api/config').then(r => r.json());
      if(typeof cfg.sandbox === 'boolean') sandbox = cfg.sandbox;
    }catch(e){
      console.warn('Failed to load /api/config, defaulting to sandbox mode:', e.message);
    }
    await Pi.init({ version: "2.0", sandbox });
    piReady = true;
    document.getElementById('piStatus').textContent = sandbox ? 'Pi Browser (sandbox)' : 'Pi Browser';
  }catch(e){ console.warn('Pi SDK init skipped:', e.message); showPiDiag('Pi init failed: ' + (e && e.message ? e.message : e)); }
}
async function piAuthenticate(){
  if(typeof Pi === 'undefined'){ showPiDiag('Pi SDK not loaded (open in Pi Browser)'); return null; }
  try{
    showPiDiag('');
    const authResult = await Pi.authenticate(['username','payments'], onIncompletePaymentFound);
    piUser = authResult.user;
    piAccessToken = authResult.accessToken;
    document.getElementById('piStatus').textContent = `@${piUser.username}`;
    updateSignInButton();
    return authResult;
  }catch(e){
    console.error('Pi authenticate failed', e);
    // 原因が分かるよう、画面にもエラー内容を表示する(例: 未検証ドメイン、Pi Browser以外での実行)
    let detail = (e && e.message) ? e.message : (typeof e === 'string' ? e : JSON.stringify(e));
    const embedded = (window.self !== window.top);
    showPiDiag('Sign-in failed: ' + detail + ' [embedded=' + embedded + ', origin=' + location.origin + ']');
    return null;
  }
}
function onIncompletePaymentFound(payment){ console.log('未完了の支払いを検出:', payment); }
initPi().then(() => { if(piReady) piAuthenticate(); });
document.getElementById('piSignIn').addEventListener('click', async () => {
  if(!piReady) await initPi();
  await piAuthenticate();
});

async function loadNews(){
  try{
    const res = await fetch('/api/news');
    latestNews = await res.json();
  }catch(e){
    latestNews = { lastUpdated: null, articles: [] };
  }
  renderNews();
}
function renderNews(){
  const t = UI[currentLang];
  const grid = document.getElementById('newsGrid');
  const meta = document.getElementById('newsMeta');
  if(latestNews.lastUpdated){
    meta.textContent = `${new Date(latestNews.lastUpdated).toLocaleString()}`;
  } else {
    meta.textContent = '';
  }
  if(!latestNews.articles || latestNews.articles.length === 0){
    grid.innerHTML = `<div class="news-empty">${t.newsEmpty}</div>`;
    return;
  }
  grid.innerHTML = latestNews.articles.map(a => {
    const i18nData = a.i18n || {};
    const tr = i18nData[currentLang] || i18nData.en || { title: a.title, description: a.description };
    const translated = currentLang !== 'en' && i18nData[currentLang];
    return `
    <div class="news-card">
      ${LEAF_SVG}
      <div class="body">
        <h3>${escapeHtml(tr.title || '')}</h3>
        <p>${escapeHtml(tr.description || '')}</p>
        ${translated ? `<span class="mt-badge">${t.machineTranslated}</span>` : ''}
        <div class="src"><span>${escapeHtml(a.source || '')}</span>${isSafeHttpUrl(a.url) ? `<a href="${escapeHtml(a.url)}" target="_blank" rel="noopener noreferrer">${t.readMore}</a>` : ''}</div>
      </div>
    </div>`;
  }).join('');
}

document.getElementById('listingForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const t = UI[currentLang];
  const msg = document.getElementById('formMsg');
  msg.textContent = '';
  const form = new FormData(e.target);
  const payload = Object.fromEntries(form.entries());

  if(typeof Pi === 'undefined'){
    msg.style.color = 'var(--primary-dark)';
    msg.textContent = t.piBrowserOnly;
    return;
  }

  // 「申し込んだ人」と「支払った人」が同一Piユーザーであることをサーバー側で
  // 検証できるようにするため、掲載データを作成する前にPi認証を済ませ、
  // アクセストークンを一緒に送る(サーバーは /v2/me でこのトークンを検証する)。
  if(!piUser){ await piAuthenticate(); }
  if(!piUser || !piAccessToken){
    msg.style.color = 'crimson';
    msg.textContent = t.piAuthRequired;
    return;
  }
  payload.piAccessToken = piAccessToken;

  try{
    const createRes = await fetch('/api/companies', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const created = await createRes.json();
    if(!createRes.ok){
      msg.style.color = 'crimson';
      msg.textContent = created.error || t.genericError;
      return;
    }

    await Pi.createPayment({
      amount: created.priceP,
      memo: `World Hemp History listing (${payload.name})`,
      metadata: { listingId: created.listingId }
    }, {
      onReadyForServerApproval: async (paymentId) => {
        await fetch('/api/payments/approve', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentId, listingId: created.listingId })
        });
      },
      onReadyForServerCompletion: async (paymentId, txid) => {
        await fetch('/api/payments/complete', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ paymentId, txid, listingId: created.listingId })
        });
        msg.style.color = 'var(--primary-dark)';
        msg.textContent = t.paymentComplete;
        setTimeout(() => { overlay.classList.remove('open'); loadCompanies(); }, 1500);
      },
      onCancel: () => { msg.textContent = t.paymentCancelled; },
      onError: (error) => { msg.style.color = 'crimson'; msg.textContent = t.paymentError; console.error(error); }
    });
  }catch(err){
    console.error(err);
    msg.style.color = 'crimson';
    msg.textContent = t.genericError;
  }
});
</script>
</body>
</html>
